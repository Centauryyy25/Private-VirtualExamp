services:
  db:
    image: postgres:15-alpine
    container_name: virtualexamp-db
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: virtualexamp
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - virtualexamp-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtualexamp-backend
    restart: always
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/virtualexamp
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=["http://${SERVER_IP}:3000"]
      - DEBUG=false
    depends_on:
      - db
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - virtualexamp-net
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP}:8000
    container_name: virtualexamp-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - virtualexamp-net
    ports:
      - "3000:3000"

networks:
  virtualexamp-net:
    driver: bridge
